services:
  - type: web
    name: little-loveseat
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOVESEAT_COOLDOWN_MS
        value: "300000"
