<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' http: https: ws: wss:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self';"
    />
    <title>Little Loveseat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="widget" id="widget">
      <header class="chrome">
        <div class="chrome-mark" aria-hidden="true"></div>
        <div class="chrome-title" id="chrome-drag">Character Customization</div>
        <div class="chrome-actions">
          <button type="button" class="pix-btn electron-only" id="btn-min" title="Minimize">_</button>
          <button type="button" class="pix-btn danger electron-only" id="btn-close" title="Close">x</button>
        </div>
      </header>

      <section class="dashboard" id="dashboard">
        <div class="cust-board">
          <div class="slot-grid" id="feature-slots"></div>
          <div class="hero">
            <div class="hero-frame">
              <canvas id="preview" width="96" height="128"></canvas>
            </div>
            <div class="hero-nav">
              <button type="button" class="nav-sq" id="prev-opt" aria-label="Previous">◀</button>
              <button type="button" class="nav-sq" id="next-opt" aria-label="Next">▶</button>
              <button type="button" class="nav-wide" id="cloth-cat" title="Clothes"></button>
            </div>
          </div>
          <div class="slot-grid" id="cloth-slots"></div>
        </div>
        <div class="info-list">
          <label class="info-row">
            <span class="info-ico">☺</span>
            <input id="char-name" maxlength="16" placeholder="your name" />
          </label>
          <div class="info-row">
            <span class="info-ico">♀</span>
            <div class="sex-row" id="sex-row">
              <button type="button" class="pix-btn" data-sex="female">She/Her</button>
              <button type="button" class="pix-btn" data-sex="male">He/Him</button>
            </div>
          </div>
          <button type="button" class="info-row action" id="create-room">
            <span class="info-ico">+</span>
            <span>Create room</span>
          </button>
          <button type="button" class="info-row action" id="open-join">
            <span class="info-ico">↪</span>
            <span>Join room</span>
          </button>
        </div>
      </section>

      <section class="stage hidden" id="stage">
        <div class="sky"></div>
        <div class="moon"></div>
        <div class="stars"></div>
        <div class="window-frame"></div>
        <div class="wall"></div>
        <div class="floor"></div>
        <div class="rug"></div>
        <div class="seats" id="seats"></div>
        <div class="fx" id="fx"></div>
      </section>

      <footer class="dock">
        <div class="you" id="you-chip">you</div>
        <div class="status" id="status">Dress up, then create or join a room.</div>
        <button type="button" class="pix-btn" id="btn-create">ME</button>
        <button type="button" class="pix-btn" id="btn-room">ROOM</button>
        <button type="button" class="pix-btn electron-only" id="btn-top" title="Always on top">TOP</button>
      </footer>
    </div>

    <div class="modal hidden" id="modal-room">
      <div class="panel">
        <h2>Join a room</h2>
        <p class="hint">Same room code + same server URL = you sit together.</p>
        <label>Room code<input id="room-code" maxlength="16" placeholder="hearth" /></label>
        <label>Server URL<input id="server-url" maxlength="180" placeholder="http://127.0.0.1:3847" /></label>
        <p class="hint" id="lan-hint">LAN invite appears after the hearth starts.</p>
        <div class="panel-actions">
          <button type="button" class="pix-btn" id="use-local">THIS PC</button>
          <button type="button" class="pix-btn" id="use-lan">LAN</button>
          <button type="button" class="pix-btn web-only" id="use-this-site">THIS SITE</button>
          <button type="button" class="pix-btn" id="copy-invite">COPY LINK</button>
          <button type="button" class="pix-btn" id="join-room">Join</button>
        </div>
      </div>
    </div>

    <div class="modal hidden" id="modal-interact">
      <div class="panel">
        <h2 id="interact-title">Say something tiny</h2>
        <p class="hint" id="rel-line">Stranger</p>
        <label>Note<input id="note" maxlength="48" placeholder="thinking of you" /></label>
        <p class="cooldown" id="cooldown"></p>
        <div class="panel-actions">
          <button type="button" class="pix-btn love" id="send-love">LOVE</button>
          <button type="button" class="pix-btn" id="send-note">SEND</button>
          <button type="button" class="pix-btn ghost" id="cancel-interact">BACK</button>
        </div>
      </div>
    </div>

    <script src="./vendor/socket.io.min.js"></script>
    <script src="./styles.js"></script>
    <script src="./sprites.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
